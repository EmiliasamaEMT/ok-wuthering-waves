name: Windows Release
run-name: mc-helper release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

jobs:
  validate:
    name: 1 · Validate
    runs-on: windows-latest
    outputs:
      is_prerelease: ${{ steps.release_version.outputs.is_prerelease }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release_version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-.](?:alpha|beta|rc)(?:\.[0-9]+)?)?$') {
            throw "Unsupported release tag: $env:RELEASE_TAG"
          }
          $isPrerelease = $env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$'
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Run tests
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_TOKEN: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          GEMINI_API_KEY: ''
          AI_API_KEY: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_TOKEN',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'GEMINI_API_KEY',
            'AI_API_KEY',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
            Write-Host "Running tests in $($_.FullName)"
            python -u run_test.py $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed in $($_.FullName)"
            }
          }

  package:
    name: 2 · Build portable packages
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Build portable packages
        id: build
        uses: ok-oldking/pyappify-action@69bf7ae364e8c7f0606f34df86d432168a46f4bf
        with:
          app_version: ${{ github.ref_name }}
          version: v1.2.7
          build_setup: false
          add_version_name: true
          package_zip: true
          package_zip_format: 7z

      - name: Set up Python for portable launcher verification
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fix portable version discovery
        run: python .github/scripts/fix_portable_versions.py --dist "${{ steps.build.outputs.dist-path }}"

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ steps.build.outputs.dist-path }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 3 · Publish
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: mc-helper ${{ github.ref_name }}
          body: |
            mc小帮手（mc-helper）

            China 和 Global 便携包均从本仓库更新。
            [源码运行说明](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/development/contributing.md)
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            pyappify_dist/mc-helper-win32-China-*.7z
            pyappify_dist/mc-helper-win32-Global-*.7z
            pyappify_dist/mc-helper-win32.zip
            pyappify_dist/win32_sha256.txt
